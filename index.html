<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2540" />
    <meta
      name="description"
      content="OSC Professionals — Full-service eCommerce agency building Shopify, Magento, and Odoo solutions since 2000. Trusted by 500+ brands."
    />
    <title>OSCP Landing Page</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; background: #fff; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0A2540; }
      .skeleton {
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 80% -10%, rgba(0,164,189,0.18), transparent 60%),
                    radial-gradient(900px 500px at 0% 20%, rgba(10,37,64,0.07), transparent 60%),
                    linear-gradient(180deg, #fff 0%, #F5F9FC 100%);
        padding: 60px 24px 80px;
        box-sizing: border-box;
      }
      .skeleton-inner { max-width: 1152px; margin: 0 auto; }
      .skeleton-chip {
        display: inline-block; padding: 6px 14px; border-radius: 999px;
        background: rgba(0,164,189,0.12); color: #0086A0;
        font-size: 13px; font-weight: 700; margin-bottom: 22px;
      }
      .skeleton-h1 {
        font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800;
        line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 18px;
        max-width: 720px;
      }
      .skeleton-h1 span { color: #00A4BD; }
      .skeleton-sub {
        max-width: 560px; font-size: 1.15rem;
        color: rgba(10,37,64,0.72); line-height: 1.5; margin: 0;
      }
    </style>
    <link rel="modulepreload" href="/src/main.jsx" />
  </head>
  <body>
    <div id="root">
      <!-- Static hero — visible before React boots; replaced on first render. -->
      <div class="skeleton" aria-hidden="true">
        <div class="skeleton-inner">
          <div class="skeleton-chip">Since 2000 · Full-Service eCommerce</div>
          <h1 class="skeleton-h1">Full Service <span>eCommerce Agency</span></h1>
          <p class="skeleton-sub">
            We create, build, and maintain world-class eCommerce solutions on Shopify, Magento,
            and beyond — trusted by 500+ brands since 2000.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
